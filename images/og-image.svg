<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF6F0"/>
      <stop offset="100%" stop-color="#F0E9DD"/>
    </linearGradient>
    <linearGradient id="markGradOG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A6D60"/>
      <stop offset="100%" stop-color="#2C4A40"/>
    </linearGradient>
    <radialGradient id="glow" cx="85%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#C9974A" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#C9974A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Logo lockup -->
  <g transform="translate(80, 80)">
    <g transform="translate(40, 40)">
      <circle cx="0" cy="0" r="44" fill="none" stroke="#4A6D60" stroke-width="1.2" opacity="0.25"/>
      <circle cx="0" cy="0" r="40" fill="url(#markGradOG)"/>
      <text x="0" y="14" font-family="Georgia, serif" font-style="italic" font-size="52" font-weight="500" fill="#FAF6F0" text-anchor="middle" letter-spacing="-2">A</text>
      <circle cx="22" cy="-22" r="5" fill="#C9974A"/>
    </g>
    <text x="105" y="50" font-family="Georgia, serif" font-size="40" font-weight="500" fill="#1A2942">Aeon</text>
    <circle cx="183" cy="46" r="4" fill="#C9974A"/>
    <text x="105" y="78" font-family="sans-serif" font-size="13" font-weight="600" fill="#4A6D60" letter-spacing="3">HOME HEALTH CARE</text>
  </g>

  <!-- Headline -->
  <text x="80" y="320" font-family="Georgia, serif" font-size="68" font-weight="400" fill="#1A2942">
    <tspan x="80" dy="0">Care that feels like</tspan>
    <tspan x="80" dy="80" font-style="italic" fill="#4A6D60">family, at home.</tspan>
  </text>

  <line x1="80" y1="430" x2="180" y2="430" stroke="#C9974A" stroke-width="3"/>

  <!-- Subtext -->
  <text x="80" y="475" font-family="sans-serif" font-size="22" fill="#6B6F71">Medicaid in-home care across Greater Houston, Texas</text>
  <text x="80" y="505" font-family="sans-serif" font-size="18" font-weight="500" fill="#4A6D60">In network with Molina · Community Health Choice · DADS</text>
  <text x="80" y="558" font-family="sans-serif" font-size="22" font-weight="600" fill="#C9974A">aeonhomecare.com  ·  (713) 240-2518</text>
</svg>
